<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<style>text{font-family:Arial,sans-serif;fill:#17324d}.t{font-size:25px;font-weight:bold}.h{font-size:17px;font-weight:bold}.b{font-size:14px}.life{stroke:#8ba2b7;stroke-width:2;stroke-dasharray:6 5}.msg{stroke:#2e74b5;stroke-width:2;marker-end:url(#a)}.ret{stroke:#6f7f8f;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e74b5"/></marker></defs>
<text x="600" y="35" text-anchor="middle" class="t">Sequence — Tạo và hoàn tất đơn hàng</text>
<g class="h" text-anchor="middle"><text x="100" y="85">Client</text><text x="330" y="85">OrdersController</text><text x="580" y="85">OrderService</text><text x="830" y="85">PostgreSQL</text><text x="1080" y="85">Inventory Ledger</text></g>
<g class="life"><line x1="100" y1="105" x2="100" y2="775"/><line x1="330" y1="105" x2="330" y2="775"/><line x1="580" y1="105" x2="580" y2="775"/><line x1="830" y1="105" x2="830" y2="775"/><line x1="1080" y1="105" x2="1080" y2="775"/></g>
<line x1="100" y1="145" x2="330" y2="145" class="msg"/><text x="215" y="134" text-anchor="middle" class="b">POST /orders + JWT</text>
<line x1="330" y1="195" x2="580" y2="195" class="msg"/><text x="455" y="184" text-anchor="middle" class="b">CreateAsync(request, actor)</text>
<line x1="580" y1="245" x2="830" y2="245" class="msg"/><text x="705" y="234" text-anchor="middle" class="b">BEGIN SERIALIZABLE; validate customer/Rx/voucher</text>
<line x1="580" y1="305" x2="830" y2="305" class="msg"/><text x="705" y="294" text-anchor="middle" class="b">Query inventory by expiry ASC (FEFO)</text>
<line x1="830" y1="350" x2="580" y2="350" class="ret"/><text x="705" y="339" text-anchor="middle" class="b">Available batch rows + version</text>
<line x1="580" y1="405" x2="1080" y2="405" class="msg"/><text x="830" y="394" text-anchor="middle" class="b">RESERVE transactions</text>
<line x1="580" y1="460" x2="830" y2="460" class="msg"/><text x="705" y="449" text-anchor="middle" class="b">Insert order/items/history; update reserved; COMMIT</text>
<line x1="580" y1="510" x2="330" y2="510" class="ret"/><text x="455" y="499" text-anchor="middle" class="b">OrderResponse (PENDING)</text>
<line x1="330" y1="555" x2="100" y2="555" class="ret"/><text x="215" y="544" text-anchor="middle" class="b">201 Created</text>
<line x1="100" y1="620" x2="330" y2="620" class="msg"/><text x="215" y="609" text-anchor="middle" class="b">confirm → payment → complete</text>
<line x1="330" y1="670" x2="580" y2="670" class="msg"/><text x="455" y="659" text-anchor="middle" class="b">Authorize orders.manage + branch</text>
<line x1="580" y1="720" x2="830" y2="720" class="msg"/><text x="705" y="709" text-anchor="middle" class="b">reserved −; on_hand −; SALE; status COMPLETED</text>
<line x1="580" y1="760" x2="1080" y2="760" class="msg"/><text x="830" y="749" text-anchor="middle" class="b">Payment/audit transaction</text>
