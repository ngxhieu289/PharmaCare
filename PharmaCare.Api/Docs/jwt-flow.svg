<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<style>text{font-family:Arial,sans-serif;fill:#17324d}.t{font-size:25px;font-weight:bold}.h{font-size:18px;font-weight:bold}.b{font-size:14px}.box{fill:#eef4fa;stroke:#2e74b5;stroke-width:2}.danger{fill:#fff0f0;stroke:#a82d2d;stroke-width:2}.arr{stroke:#365f7d;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365f7d"/></marker></defs>
<text x="600" y="35" text-anchor="middle" class="t">JWT + Refresh Token Flow</text>
<rect x="40" y="115" width="190" height="100" rx="12" class="box"/><text x="135" y="155" text-anchor="middle" class="h">Client</text><text x="135" y="182" text-anchor="middle" class="b">email + password</text>
<rect x="310" y="100" width="250" height="130" rx="12" class="box"/><text x="435" y="140" text-anchor="middle" class="h">AuthService</text><text x="435" y="168" text-anchor="middle" class="b">PasswordHasher verify</text><text x="435" y="194" text-anchor="middle" class="b">load roles + permissions</text>
<rect x="640" y="100" width="250" height="130" rx="12" class="box"/><text x="765" y="140" text-anchor="middle" class="h">TokenService</text><text x="765" y="168" text-anchor="middle" class="b">Access JWT: 15 phút</text><text x="765" y="194" text-anchor="middle" class="b">Refresh: random + hash DB</text>
<rect x="970" y="115" width="190" height="100" rx="12" class="box"/><text x="1065" y="155" text-anchor="middle" class="h">Protected API</text><text x="1065" y="182" text-anchor="middle" class="b">policy + branch scope</text>
<line x1="230" y1="165" x2="310" y2="165" class="arr"/><line x1="560" y1="165" x2="640" y2="165" class="arr"/><line x1="890" y1="165" x2="970" y2="165" class="arr"/>
<rect x="245" y="310" width="710" height="130" rx="12" class="danger"/><text x="600" y="345" text-anchor="middle" class="h">Refresh rotation / revoke</text><text x="600" y="375" text-anchor="middle" class="b">Client gửi refresh token → server so sánh hash + expiry + revoked_at</text><text x="600" y="402" text-anchor="middle" class="b">Token cũ bị revoke và liên kết token mới; đổi mật khẩu thu hồi toàn bộ phiên</text><text x="600" y="429" text-anchor="middle" class="b">401: thiếu/sai token · 403: đã xác thực nhưng thiếu permission/phạm vi chi nhánh</text>
</svg>
