<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<style>text{font-family:Arial,sans-serif;fill:#17324d}.t{font-size:26px;font-weight:bold}.h{font-size:20px;font-weight:bold}.b{font-size:16px}.box{fill:#eef4fa;stroke:#2e74b5;stroke-width:3}.actor{fill:#f7f8fa;stroke:#586879;stroke-width:2}.ext{fill:#fff6df;stroke:#b18418;stroke-width:2}.arr{stroke:#365f7d;stroke-width:3;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365f7d"/></marker></defs>
