<rect x="35" y="90" width="250" height="92" rx="12" class="actor"/><text x="160" y="130" text-anchor="middle" class="h">Khách hàng</text><text x="160" y="158" text-anchor="middle" class="b">Mua thuốc, tải đơn thuốc</text>
<rect x="35" y="250" width="250" height="92" rx="12" class="actor"/><text x="160" y="290" text-anchor="middle" class="h">Dược sĩ / Nhân viên kho</text><text x="160" y="318" text-anchor="middle" class="b">Duyệt Rx, xử lý kho/đơn</text>
<rect x="35" y="410" width="250" height="92" rx="12" class="actor"/><text x="160" y="450" text-anchor="middle" class="h">Quản lý / Admin</text><text x="160" y="478" text-anchor="middle" class="b">Quản trị, voucher, báo cáo</text>
